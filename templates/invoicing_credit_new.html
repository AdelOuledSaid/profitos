{% extends "base.html" %}
{% block content %}
<div class="purchase-page">
  <div class="purchase-toolbar">
    <div class="purchase-nav-actions">
      <a class="purchase-nav-btn" href="{{ url_for('invoicing_detail',invoice_id=inv.id) }}">← Retour à la facture</a>
    </div>
  </div>

  <div class="purchase-eyebrow">FACTURATION · AVOIR</div>
  <h1 class="purchase-title">Créer un avoir</h1>
  <p class="purchase-subtitle">Facture d'origine : <strong>{{ inv.invoice_number }}</strong> · {{ inv.client_name }}</p>

  <section class="purchase-panel">
    <form method="post" class="formgrid">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Montant TTC de l'avoir (€)<input type="number" name="amount_ttc" min="0.01" max="{{ '%.2f'|format(remaining) }}" step="0.01" required></label>
      <label>Maximum disponible<input value="{{ '%.2f'|format(remaining) }} €" disabled></label>
      <label class="wide">Motif de l'avoir<input name="reason" required placeholder="Ex. remboursement partiel, erreur de facturation"></label>
      <div class="wide" style="margin-top:12px;">
        <button type="submit" class="purchase-primary-btn primary">Créer l'avoir</button>
      </div>
    </form>
  </section>
</div>
{% endblock %}
