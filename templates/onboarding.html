{% extends "base.html" %}{% block content %}<div class="eyebrow green">ONBOARDING</div><h1>Configurer {{ org.name if org else "votre entreprise" }}.</h1><section class="panel formpanel"><form method="post" class="formgrid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Entreprise<input name="company_name" value="{{ profile.name if profile else (org.name if org else '') }}" required></label><label>Ville<input name="city" value="{{ profile.city if profile else '' }}" required></label><label>Département<input name="department" value="{{ profile.department if profile else '' }}" placeholder="14" required></label><label>Départements d'intervention<input name="allowed_departments" value="{{ profile.allowed_departments if profile else '' }}" placeholder="14,50,61"></label><label class="wide">Activités<textarea name="activities" rows="4" required>{{ profile.activities if profile else '' }}</textarea></label><label class="wide">Certifications<input name="certifications" value="{{ profile.certifications if profile else '' }}"></label><div class="wide"><button>Terminer l'onboarding</button></div></form></section>{% endblock %}
