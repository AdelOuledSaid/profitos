{% extends "base.html" %}{% block content %}
<div class="eyebrow">FACTURATION</div><h1>Nouvelle facture fournisseur</h1>
<form method="post" class="panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Fournisseur enregistré<select name="supplier_id"><option value="">— Saisie manuelle —</option>
{% for s in suppliers %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select></label>
<label>Nom du fournisseur<input name="supplier_name"></label>
<label>N° facture fournisseur<input name="invoice_number" required></label>
<label>Date de facture<input name="issue_date" type="date"></label>
<label>Date d'échéance<input name="due_date" type="date"></label>
<label>Montant HT<input name="subtotal" type="number" step="0.01" min="0" required></label>
<label>TVA<input name="vat_amount" type="number" step="0.01" min="0" value="0"></label>
<label>Notes<textarea name="notes"></textarea></label>
<button>Enregistrer la facture</button></form>{% endblock %}
