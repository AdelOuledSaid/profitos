{% extends "base.html" %}
{% block content %}
<div class="purchase-page">
<div class="purchase-toolbar">
  <div>
    <div class="purchase-eyebrow">COMPTABILITÉ · CUT-OFF</div>
    <h1 class="purchase-title">Nouvelle écriture de cut-off</h1>
    <p class="purchase-subtitle">Rattache une charge ou un produit à la bonne période, même sans la facture. L'extourne (contre-passation) se déclenche séparément, au début de la période suivante.</p>
  </div>
  <a class="purchase-nav-btn" href="{{ url_for('cutoff_list') }}">← Cut-off</a>
</div>

<section class="purchase-panel" style="max-width:560px;">
  <form method="post" class="formgrid">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="wide">Type
      <select name="cutoff_type">
        <option value="CCA">CCA — Charge constatée d'avance (payée en avance)</option>
        <option value="FNP">FNP — Facture non parvenue (reçu, facture pas encore arrivée)</option>
        <option value="FAE">FAE — Facture à établir (livré, facture pas encore émise)</option>
      </select>
    </label>
    <label class="wide">Libellé<input name="label" placeholder="ex: Assurance annuelle — part 2027" required></label>
    <label>Montant (€)<input type="number" name="amount" step="0.01" min="0.01" required></label>
    <label>Date de clôture concernée<input type="date" name="period_end_date" value="{{ today }}"></label>
    <label class="wide">Compte de contrepartie (charge classe 6 ou produit classe 7)
      <select name="counterpart_account_code">
        {% for a in accounts %}<option value="{{ a.code }}">{{ a.code }} — {{ a.label }}</option>{% endfor %}
      </select>
    </label>
    <div class="wide"><button type="submit" class="purchase-primary-btn primary">Enregistrer</button></div>
  </form>
</section>
</div>
{% endblock %}
