<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Créer un compte · ProfitOS</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body class="authpage"><div class="authcard"><div class="brand">Profit<span>OS</span></div><div class="eyebrow">14-DAY TRIAL</div><h1>Créer votre espace ProfitOS</h1>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}{% endwith %}<form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nom complet<input name="full_name" required></label><label>E-mail professionnel<input name="email" type="email" required></label><label>Entreprise<input name="company_name" required></label><label>Mot de passe<input name="password" type="password" minlength="8" required></label><button>Créer mon espace</button></form><p class="muted">Déjà inscrit ? <a class="link" href="{{ url_for('login') }}">Se connecter</a></p></div></body></html>
