<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Créer un compte — ProfitOS</title><link rel="stylesheet" href="{{ asset_url('style.css') }}"><link rel="stylesheet" href="{{ asset_url('purchase.css') }}"></head><body class="authpage"><main class="authcard"><div class="brand">Profit<span>OS</span></div><div class="eyebrow">ESSAI GRATUIT DE 14 JOURS</div><h1>Créer votre espace</h1>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="flash" role="alert">{{ m }}</div>{% endfor %}{% endwith %}<form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nom complet<input name="full_name" autocomplete="name" value="{{ form.full_name or '' }}" required></label><label>E-mail professionnel<input name="email" type="email" autocomplete="email" value="{{ form.email or '' }}" required></label><label>Entreprise<input name="company_name" autocomplete="organization" value="{{ form.company_name or '' }}" required></label><label>Mot de passe<input name="password" type="password" minlength="12" autocomplete="new-password" aria-describedby="password-rules" required><span class="lot-hint" id="password-rules">12 caractères minimum. Évitez les mots de passe courants et ceux qui reprennent votre adresse e-mail ; une phrase de plusieurs mots est idéale.</span></label><label class="check auth-terms"><input type="checkbox" name="accept_terms" value="1" required> <span>J'accepte les <a class="link" href="{{ url_for('terms_of_use') }}" target="_blank" rel="noopener">conditions générales d'utilisation</a> et les <a class="link" href="{{ url_for('terms_of_sale') }}" target="_blank" rel="noopener">conditions générales de vente</a>, et j'ai lu la <a class="link" href="{{ url_for('privacy_policy') }}" target="_blank" rel="noopener">politique de confidentialité</a>.</span></label><button>Créer mon espace</button></form><p class="muted">Sans carte bancaire. Déjà inscrit ? <a class="link" href="{{ url_for('login') }}">Se connecter</a></p></main></body></html>
