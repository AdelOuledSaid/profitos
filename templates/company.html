{% extends "base.html" %}{% block content %}<div class="eyebrow">COMPANY PROFILE</div><h1>Profil entreprise</h1><p class="muted">La V0 utilise un filtre géographique strict par département.</p><section class="panel formpanel"><form method="post" class="formgrid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nom<input name="name" value="{{ p.name if p else '' }}"></label><label>Ville<input name="city" value="{{ p.city if p else '' }}"></label><label>Département principal<input name="department" value="{{ p.department if p else '' }}" placeholder="14"></label><label>Départements d'intervention<input name="allowed_departments" value="{{ p.allowed_departments if p else '' }}" placeholder="14, 50, 61, 27"></label><label class="wide">Activités<textarea name="activities" rows="4">{{ p.activities if p else '' }}</textarea></label><label class="wide">Certifications<input name="certifications" value="{{ p.certifications if p else '' }}"></label><div class="wide"><button>Enregistrer et actualiser GROW</button></div></form></section>{% endblock %}
