<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mot de passe oublié · ProfitOS</title><link rel="stylesheet" href="{{ asset_url('style.css') }}"></head><body class="authpage"><div class="authcard"><div class="brand">Profit<span>OS</span></div><div class="eyebrow">RESET PASSWORD</div><h1>Mot de passe oublié</h1>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}{% endwith %}<p class="muted">Indiquez votre email professionnel. Si un compte existe, vous recevrez un lien de réinitialisation valable 1 heure.</p><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>E-mail<input name="email" type="email" required></label><button>Envoyer le lien</button></form><p class="muted"><a class="link" href="{{ url_for('login') }}">← Retour à la connexion</a></p></div></body></html>
