<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Double authentification · ProfitOS</title><link rel="stylesheet" href="{{ asset_url('style.css') }}"></head><body class="authpage"><div class="authcard"><div class="brand">Profit<span>OS</span></div><div class="eyebrow">DOUBLE AUTHENTIFICATION</div><h1>Code de vérification</h1>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}{% endwith %}<p class="muted">Saisissez le code à 6 chiffres affiché par votre application d'authentification, ou l'un de vos codes de secours.</p><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Code<input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="20" required autofocus></label><button>Valider</button></form><p class="muted"><a class="link" href="{{ url_for('login') }}">Revenir à la connexion</a></p></div></body></html>
