{% extends "base.html" %}{% block content %}
<div class="eyebrow">SECURE ERROR</div><h1>{{ code }} — {{ title }}</h1>
<section class="panel narrow"><p>{{ message }}</p>{% if request_id %}<p class="muted">Request ID : <code>{{ request_id }}</code></p>{% endif %}<p><a class="button" href="{{ url_for('home') if session.get('user_id') else url_for('login') }}">Retour</a></p></section>
{% endblock %}
