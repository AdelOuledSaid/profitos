<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }}</title></head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:24px auto;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e5e7eb;">
  <tr><td style="background:#111827;padding:24px 32px;">
    <div style="color:#ffffff;font-size:18px;font-weight:600;">Profit<span style="color:#9ca3af;">OS</span></div>
  </td></tr>
  <tr><td style="padding:28px 32px 8px;">
    <div style="font-size:18px;font-weight:600;color:#111827;margin-bottom:10px;">{{ title }}</div>
    <div style="font-size:14px;color:#374151;line-height:1.5;">{{ intro }}</div>
  </td></tr>
  <tr><td style="padding:20px 32px 32px;">
    <a href="{{ cta_url }}" style="display:inline-block;background:#111827;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;padding:12px 22px;border-radius:8px;">{{ cta_label }}</a>
  </td></tr>
  <tr><td style="padding:16px 32px;border-top:1px solid #f0f0f0;">
    <div style="font-size:12px;color:#9ca3af;">{{ footer }}</div>
  </td></tr>
</table>
</body></html>
