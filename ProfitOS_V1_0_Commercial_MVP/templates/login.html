<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion — ProfitOS</title><link rel="stylesheet" href="{{ asset_url('style.css') }}"></head><body class="authpage"><main class="authcard"><div class="brand">Profit<span>OS</span></div><h1>Connexion</h1>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="flash" role="alert">{{ m }}</div>{% endfor %}{% endwith %}<form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>E-mail<input name="email" type="email" autocomplete="email" value="{{ login_email or '' }}" required{% if not login_email %} autofocus{% endif %}></label><label>Mot de passe<input name="password" type="password" autocomplete="current-password" required{% if login_email %} autofocus{% endif %}></label><button>Se connecter</button></form><p class="muted"><a class="link" href="{{ url_for('forgot_password') }}">Mot de passe oublié ?</a></p><p class="muted">Pas encore de compte ? <a class="link" href="{{ url_for('signup') }}">Créer une organisation</a></p></main></body></html>
