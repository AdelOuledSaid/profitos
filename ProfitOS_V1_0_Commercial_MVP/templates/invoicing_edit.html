{% extends "base.html" %}
{% block content %}
<div class="purchase-page">
  <div class="purchase-toolbar">
    <div class="purchase-nav-actions">
      <a class="purchase-nav-btn" href="{{ url_for('invoicing_detail',invoice_id=inv.id) }}">← Retour à la facture</a>
    </div>
  </div>

  <div class="purchase-eyebrow">FACTURATION</div>
  <h1 class="purchase-title">Modifier {{ inv|invoice_label }}</h1>
  <p class="purchase-subtitle">Modification autorisée uniquement tant que la facture reste en brouillon.</p>

  <section class="purchase-panel">
    <form method="post" class="formgrid">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      {% include "_invoice_header_fields.html" %}

      <div class="purchase-field-group wide" style="grid-column:1/-1;">
        <label class="wide">Notes (optionnel)<textarea name="notes" rows="3">{{ f.notes or '' }}</textarea></label>
      </div>

      <div class="wide" style="margin-top:12px;grid-column:1/-1;display:flex;gap:12px;">
        <button type="submit" class="purchase-primary-btn primary">Enregistrer les modifications</button>
        <a class="purchase-nav-btn" href="{{ url_for('invoicing_detail',invoice_id=inv.id) }}">Annuler</a>
      </div>
    </form>
  </section>
</div>
{% endblock %}
