services:
  - type: web
    name: profitos
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/cloud_preflight.py --init-tenants && gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /readyz
    autoDeployTrigger: commit
    envVars:
      - key: PROFITOS_ENV
        value: production
      - key: PROFITOS_SECRET_KEY
        generateValue: true
      - key: APP_BASE_URL
        value: https://profitos.onrender.com
      - key: MAX_UPLOAD_MB
        value: 15
      - key: SESSION_HOURS
        value: 12
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER_ID
        sync: false
      - key: STRIPE_PRICE_PRO_ID
        sync: false
      - key: STRIPE_PRICE_BUSINESS_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: profitos-db
          property: connectionString

databases:
  - name: profitos-db
    databaseName: profitos
    user: profitos
    plan: free
    region: frankfurt
