services:
  - type: web
    name: profitos
    runtime: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python scripts/cloud_preflight.py --init-tenants
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /readyz
    autoDeployTrigger: checksPass
    envVars:
      - key: PROFITOS_ENV
        value: production
      - key: PROFITOS_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: profitos-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: profitos-db
    databaseName: profitos
    user: profitos
