services:
  - type: web
    name: profitos
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python scripts/cloud_preflight.py --init-tenants
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /readyz
    autoDeployTrigger: commit
    envVars:
      - key: PROFITOS_ENV
        value: production
      - key: PROFITOS_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: profitos-db
          property: connectionString

databases:
  - name: profitos-db
    databaseName: profitos
    user: profitos
    plan: free
    region: frankfurt
