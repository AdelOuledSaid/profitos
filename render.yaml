services:
  - type: web
    name: profitos
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/cloud_preflight.py --init-tenants && gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /readyz
    autoDeployTrigger: commit
    envVars:
      - key: PROFITOS_ENV
        value: production
      - key: PROFITOS_SECRET_KEY
        generateValue: true
      - key: APP_BASE_URL
        value: https://app.profitos.fr
      - key: MAX_UPLOAD_MB
        value: 15
      - key: SESSION_HOURS
        value: 12
      - key: RESEND_FROM_EMAIL
        value: ProfitOS <noreply@profitos.fr>
      - key: RESEND_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: profitos-rate-limit
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: profitos-db
          property: connectionString

  - type: keyvalue
    name: profitos-rate-limit
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off

databases:
  - name: profitos-db
    databaseName: profitos
    user: profitos
    plan: 0.1c-256mb
    region: frankfurt
